<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Live</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">YouTube</div>
        </div>
        <div class="nav-center">
            <input type="text" placeholder="Search" class="search-bar">
        </div>
        <div class="nav-right">
            <div class="profile-icon">👤</div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="video-section">
            <!-- Video Player (YouTube Video - HIDDEN BY DEFAULT) -->
            <div class="video-wrapper" id="video-wrapper">
                <!-- ⬇️ YEH VIDEO PEHLE HIDDEN HOGI ⬇️ -->
                <div id="video-placeholder" style="display: flex; justify-content: center; align-items: center; height: 100%; background: #0a0a0a; color: #fff; font-size: 24px; flex-direction: column;">
                    <div style="font-size: 60px; margin-bottom: 20px;">🎥</div>
                    <div>Camera access required to play video</div>
                    <div style="font-size: 14px; color: #666; margin-top: 10px;">Please allow camera access</div>
                </div>
                <iframe id="youtube-video" 
                        src="" 
                        title="YouTube video player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen
                        style="display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0;">
                </iframe>
            </div>
            
            <!-- Video Title -->
            <h1 class="video-title">Live Stream: Exclusive Content</h1>
        </div>
        
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-video">
                <div class="thumb"></div>
                <div class="info">
                    <h4>Trending Video</h4>
                    <p>2.5M views</p>
                </div>
            </div>
            <div class="sidebar-video">
                <div class="thumb"></div>
                <div class="info">
                    <h4>Popular Live Stream</h4>
                    <p>1.2M views</p>
                </div>
            </div>
            <div class="sidebar-video">
                <div class="thumb"></div>
                <div class="info">
                    <h4>Recommended</h4>
                    <p>800K views</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
